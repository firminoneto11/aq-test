app = "aq-interviewer-fn11-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DB_DRIVER = "asyncpg"
  HOST = "0.0.0.0"
  PORT = "8000"
  HTTP_WORKERS = "1"
  ALLOWED_ORIGINS = '["https://aq-interviewer-fn11-web.fly.dev"]'

[deploy]
  release_command = "sh -c 'python -m alembic upgrade head && python manage.py seed-jobs'"
  release_command_timeout = "10m"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/probes/ready"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
