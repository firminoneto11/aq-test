[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/domain",
    "src/infra",
    "src/shared",
    "src/conf",
    "entrypoints",
]

[project]
name = "aq-test"
version = "0.0.1"
description = "AfterQuery's technical test"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "argon2-cffi>=25.1.0",
    "asgi-lifespan>=2.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "environs>=15.2.0",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=3.2.0",
    "langchain-openrouter>=0.2.9",
    "livekit-agents[deepgram,elevenlabs,openai,silero]==1.8.6",
    "livekit-api>=1.2.1",
    "psutil>=7.2.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.72.0",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uuid7>=0.1.0",
    "uvicorn>=0.54.0",
    "uvicorn-worker>=0.4.0",
    "uvloop>=0.23.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.9.4",
    "coverage>=7.16.2",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.8.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.17.0",
    "testcontainers>=4.15.0",
]

# -- Library configs -- #

# Ruff Configs
[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "."]

[tool.ruff.lint]
ignore = ["E501", "UP035"]

# Pyright configs
[tool.pyright]
typeCheckingMode = "strict"
extraPaths = ["src"]
ignore = ["zFiles"]
venvPath = "."
venv = ".venv"
reportUnusedImport = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

# Bandit configs
[tool.bandit]
exclude_dirs = ["tests/", ".venv/"]

# Pytest configs
[tool.pytest.ini_options]
addopts = "-s -v --durations=10"
markers = []
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Pytest-Env configs
[tool.pytest_env]
ENVIRONMENT = "testing"
DB_DRIVER = "asyncpg"
DB_SERVER = "postgresql+driver://postgres:postgres@postgres:5432/test"
JWT_SECRET = "test-secret-key-with-at-least-thirty-two-bytes"

# Coverage configs
[tool.coverage.run]
branch = false
source = ["app", "infra", "domain", "shared", "conf"]
data_file = ".coverage/coverage"
omit = ["tests/*", ".venv/*", "*conftest.py", "manage.py"]

[tool.coverage.report]
skip_covered = true
precision = 2
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "@abstractmethod"]

[tool.coverage.html]
directory = ".coverage/html-report"
skip_covered = true
